<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tandem — Signing</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/avatar.css" />
</head>
<body>
<div class="call-shell">

  <!-- Header -->
  <header class="call-header">
    <a href="/" class="call-brand">
      <div class="call-logo">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h3M5 7v10M9 4v16M13 9v6M17 6v12M21 12h-3"/>
        </svg>
      </div>
      Tandem
    </a>

    <div class="call-status">
      <div id="status-dot" class="status-dot waiting"></div>
      <span id="status-text" class="call-status-text">Initializing…</span>
    </div>

    <div class="room-tag" id="roomTag" style="display:none">
      Room <span id="roomTagCode"></span>
    </div>

    <span class="role-badge badge-deaf">Deaf / HoH</span>
  </header>

  <!-- Body -->
  <div class="call-body">

    <!-- Primary: your signing camera -->
    <div class="call-stage" id="callStage">
      <video id="aslVideo" autoplay playsinline muted></video>

      <!-- Waiting state -->
      <div class="stage-waiting" id="stageWaiting">
        <div class="stage-waiting-avatar">
          <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M18 11V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2"/><path d="M14 10V4a2 2 0 0 0-2-2 2 2 0 0 0-2 2v2"/><path d="M10 10.5V6a2 2 0 0 0-2-2 2 2 0 0 0-2 2v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.86-5.99-2.34l-3.6-3.6a2 2 0 0 1 2.83-2.82L7 15"/>
          </svg>
        </div>
        <p>Starting camera…</p>
        <div class="spinner"></div>
      </div>

      <div class="stage-scrim"></div>

      <!-- PIP: hearing user -->
      <div class="stage-pip" title="Hearing user">
        <video id="remoteVideo" autoplay playsinline></video>
      </div>

      <!-- ASL hero overlay -->
      <div class="stage-info">
        <div class="asl-hero">
          <span class="asl-hero-letter" id="aslPrediction"></span>
          <div class="asl-hero-sub">
            <span class="asl-building" id="aslHistoryLine"></span>
            <span class="asl-status-tag" id="aslStatus">Loading…</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Sidebar: avatar + captions -->
    <aside class="call-sidebar">

      <!-- Avatar section -->
      <div class="sidebar-panel" style="flex:1; min-height:0;">
        <div class="sidebar-panel-head">
          <div class="sidebar-panel-dot dot-dim"></div>
          <span class="sidebar-panel-title">Signing Avatar</span>
        </div>
        <div class="sidebar-panel-body">
          <div id="avatar-panel" style="height:100%;"></div>
        </div>
      </div>

      <!-- Their speech captions -->
      <div class="sidebar-panel" style="flex-shrink:0;">
        <div class="captions-pane" id="remoteSubtitleStrip">
          <p class="captions-label">Hearing user says</p>
          <p id="remoteCaptions" class="captions-text">Waiting for speech…</p>
        </div>
      </div>

    </aside>
  </div>

  <!-- Controls -->
  <div class="call-controls">
    <div class="ctrl-group">
      <button id="toggleMic" class="ctrl-btn" title="Toggle mic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
        Mic
      </button>
      <button id="toggleCamera" class="ctrl-btn" title="Toggle camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 7l-7 5 7 5V7z"/>
          <rect x="1" y="5" width="15" height="14" rx="2" ry="2"/>
        </svg>
        Camera
      </button>
    </div>

    <div class="ctrl-divider"></div>

    <div class="ctrl-room">
      Room&nbsp;<span class="ctrl-room-code" id="ctrlRoomCode">—</span>
    </div>

    <div class="ctrl-divider"></div>

    <a href="/" class="ctrl-leave">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      Leave
    </a>
  </div>

</div>

<!-- Hidden WebRTC track video -->
<video id="localVideo" autoplay playsinline muted style="display:none;"></video>

<script>
(function () {
  const room = new URLSearchParams(window.location.search).get('room') || '';
  if (room) {
    const tag = document.getElementById('roomTag');
    const tagCode = document.getElementById('roomTagCode');
    const ctrl = document.getElementById('ctrlRoomCode');
    if (tagCode) tagCode.textContent = room;
    if (ctrl) ctrl.textContent = room;
    if (tag) tag.style.display = 'flex';
  }

  // Hide waiting overlay once video plays
  const vid = document.getElementById('aslVideo');
  const waiting = document.getElementById('stageWaiting');
  if (vid && waiting) {
    vid.addEventListener('playing', () => {
      waiting.style.opacity = '0';
      waiting.style.transition = 'opacity 0.4s';
      setTimeout(() => { waiting.style.display = 'none'; }, 400);
    }, { once: true });
  }

  // Remote captions live class
  const remoteCap = document.getElementById('remoteCaptions');
  if (remoteCap) {
    new MutationObserver(() => {
      const t = remoteCap.textContent || '';
      remoteCap.classList.toggle('live', t !== 'Waiting for speech…' && t.length > 0);
    }).observe(remoteCap, { childList: true, characterData: true, subtree: true });
  }

  // Status dot
  const statusEl = document.getElementById('status-text');
  const dotEl = document.getElementById('status-dot');
  new MutationObserver(() => {
    const t = (statusEl.textContent || '').toLowerCase();
    dotEl.className = 'status-dot ' + (
      t.includes('error') ? 'error' :
      (t.includes('connect') && !t.includes('error')) ? 'connected' : 'waiting'
    );
  }).observe(statusEl, { childList: true, characterData: true, subtree: true });
})();
</script>

<script src="/avatar.js" type="module"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="/script.js" type="module"></script>
<script src="/deaf.js" type="module"></script>
</body>
</html>
