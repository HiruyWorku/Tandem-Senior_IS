name: WebRTC diagnostics
on:
  push:
    branches: [production-rebuild]
permissions:
  contents: read
jobs:
  webkit-renewal:
    if: contains(github.event.head_commit.message, '[webrtc-diagnostic]')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tandem-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tandem-app/package-lock.json
      - run: npm ci
      - name: Configure bounded Ubuntu package downloads
        run: |
          test -f /etc/apt/apt-mirrors.txt
          printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt
          printf '%s\n' 'Acquire::Retries "2";' 'Acquire::http::Timeout "30";' 'Acquire::https::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99-tandem-downloads
      - run: npx playwright install --with-deps webkit
        timeout-minutes: 10
      - name: Repeat synthetic renewal with count-only playback diagnostics
        run: npm run test:browser:compat -- --project webkit --grep 'scheduled ICE renewal' --repeat-each 12
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: synthetic-webkit-renewal-results
          path: tandem-app/test-results-compat/
          retention-days: 7
